name: Offline Security CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline regression - Python 3.12

    runs-on: ubuntu-latest

    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Verify local integration isolation
        run: |
          python - <<'PY'
          from fnmatch import fnmatch

          local_tests = (
              "local_integrated_regression.py",
              "local_runtime_regression.py",
              "local_runtime_ai_regression.py",
          )

          assert all(
              not fnmatch(test, "test_*.py")
              for test in local_tests
          )

          print("[OK] Local integration excluded from test_*.py.")
          print("[OK] No DPAPI or PostgreSQL required.")
          PY

      - name: Run bridge security tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_bridge_*.py" \
            -v

      - name: Run authenticated HTTP client tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_local_http_client.py" \
            -v

      - name: Run Context Decision Gate tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_decision_gate.py" \
            -v

      - name: Run local decision pipeline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_local_decision_pipeline.py" \
            -v

      - name: Run AI Review Adapter tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_ai_review_adapter.py" \
            -v

      - name: Run MOCK AI Orchestrator tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_ai_review_orchestrator.py" \
            -v

      - name: Run SHA-256 integrity tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_ai_review_integrity.py" \
            -v

      - name: Run offline integrated regression
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_integrated_mock_regression.py" \
            -v

      - name: Run observability collector tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_observability_collector.py" \
            -v

      - name: Run observed pipeline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_observed_mock_pipeline.py" \
            -v

      - name: Run observability integration tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_observability_integration.py" \
            -v

      - name: Run integrated MOCK WF-05 report tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_integrated_mock_report.py" \
            -v

      - name: Run memory traceability tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_memory_traceability.py" \
            -v

      - name: Run memory trace registry tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_memory_trace_registry.py" \
            -v

      - name: Run generic WF-05 contract tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_generic_wf05_contract.py" \
            -v

      - name: Run generic integrated MOCK report tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_generic_integrated_mock_report.py" \
            -v

      - name: Run generic memory traceability tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_generic_memory_traceability.py" \
            -v

      - name: Run generic memory registry tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_generic_memory_trace_registry.py" \
            -v
      - name: Run unified local MOCK composer tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_local_mock_composer.py" \
            -v

      - name: Run local runtime consumer offline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_local_runtime_composer.py" \
            -v

      - name: Run local Runtime AI offline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_local_runtime_ai.py" \
            -v

      - name: Run Runtime AI integrity and report offline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_runtime_ai_artifacts.py" \
            -v

      - name: Run complete Runtime AI HTML offline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_local_runtime_ai_report.py" \
            -v
